<html lang="vi" class="light">

    <meta charset="UTF-8" />

    <meta name="description" content="Ứng dụng xem huyền học cá nhân hàng ngày: Kỳ Môn Độn Giáp, Tử Vi Đẩu Số và Bát Tự Tứ Trụ" />

    <script>
      // Đăng ký Service Worker chuẩn PWA để kích hoạt nút cài đặt ở thanh địa chỉ trình duyệt
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('PWA ServiceWorker registered successfully, scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('PWA ServiceWorker registration failed:', err);
            });
        });
      }
    </script>

  </body>
